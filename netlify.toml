[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: serve index.html for any unknown path
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed assets are immutable — cache hard
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
